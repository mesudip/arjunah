name: Release

# Pushing a tag such as v1.0.0-alpha.1 builds the extension archives and
# attaches them to a GitHub Release. A hyphen in the tag marks a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v$version" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run lint:firefox
      - run: npm run pack
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.xpi
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **Chrome / Brave / Edge**: download the `.zip`, unzip it, open `chrome://extensions`, turn on Developer mode, choose **Load unpacked**, and pick the unzipped folder.
            **Firefox**: the `.xpi` is unsigned; load it from `about:debugging#/runtime/this-firefox` as a temporary add-on.
            **Desktop app**: `npm install -g arjunah-desktop && arjunah-desktop install`.
            Full instructions: docs/INSTALL.md.
